[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sincro-robo"
version = "0.4.0"
description = "Ferramenta manual de sincronismo entre visão computacional e robô"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
pcbox = [
  "aphyt>=0.1.24,<1",
  "rfdetr==1.10.1",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
]

[project.scripts]
sincro-robo = "sincro_robo.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sincro_robo*"]

[tool.setuptools.package-data]
sincro_robo = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
